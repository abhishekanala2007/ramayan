<!DOCTYPE html> <html lang="en"> <head>   <meta charset="UTF-8">   <meta name="viewport" content="width=device-width, initial-scale=1.0">   <title>Maha Ramayan - Maha Ramayanam</title>   <style>     #bg-canvas {       position: fixed;       top: 0;       left: 0;       width: 100vw;       height: 100vh;       z-index: -1;       pointer-events: none;       background: #08090a;     }      * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }     body { color: #f0f4f8; overflow-x: hidden; padding-bottom: 40px; }      header { text-align: center; padding: 30px 20px 10px; }     header h1 { font-size: 2.2rem; color: #00e5ff; text-shadow: 0 0 12px rgba(0,229,255,0.4); }     header p { color: #a855f7; font-size: 1.1rem; margin-top: 5px; }      .nav-tabs { display: flex; justify-content: center; gap: 10px; margin: 20px 0; padding: 0 10px; flex-wrap: wrap; }     .tab-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(0, 229, 255, 0.2); color: #fff; padding: 10px 18px; border-radius: 20px; cursor: pointer; transition: 0.3s; font-weight: 600; }     .tab-btn.active, .tab-btn:hover { background: rgba(0, 229, 255, 0.2); border-color: #00e5ff; box-shadow: 0 0 10px rgba(0, 229, 255, 0.3); }      .container { max-width: 900px; margin: 0 auto; padding: 0 20px; }     .tab-content { display: none; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(0,229,255,0.15); border-radius: 12px; padding: 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }     .tab-content.active { display: block; }      .kanda-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(168,85,247,0.2); border-radius: 8px; padding: 16px; margin-bottom: 15px; }     .kanda-card h3 { color: #00e5ff; margin-bottom: 8px; }     .controls { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }     .btn { background: #a855f7; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; }     .btn-secondary { background: rgba(0,229,255,0.2); border: 1px solid #00e5ff; }      .lang-toggle { display: inline-block; background: rgba(255,255,255,0.1); border-radius: 15px; padding: 2px; margin-bottom: 15px; }     .lang-btn { background: transparent; border: none; color: #ccc; padding: 5px 12px; cursor: pointer; border-radius: 12px; }     .lang-btn.active { background: #00e5ff; color: #000; font-weight: bold; }      .quiz-q { margin-bottom: 15px; font-weight: bold; font-size: 1.1rem; }     .quiz-opt { display: block; width: 100%; text-align: left; padding: 10px; margin: 8px 0; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; border-radius: 6px; cursor: pointer; }     .quiz-opt:hover { background: rgba(168,85,247,0.3); }      .task-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; background: rgba(255,255,255,0.03); border-radius: 6px; margin-bottom: 8px; }     .task-item input { margin-right: 10px; width: 18px; height: 18px; }   </style> </head> <body>    <canvas id="bg-canvas"></canvas>    <header>     <h1>మహా రామాయణం (Maha Ramayan)</h1>     <p>Explore the Epic Journey • Kanda by Kanda</p>   </header>    <div class="nav-tabs">     <button class="tab-btn active" onclick="switchTab('epics')">📖 Ramayan Epics</button>     <button class="tab-btn" onclick="switchTab('quiz')">❓ Quiz for Kids</button>     <button class="tab-btn" onclick="switchTab('tasks')">🌟 Daily Parent-Child Tasks</button>   </div>    <div class="container">     <!-- EPICS TAB -->     <div id="epics" class="tab-content active">       <div class="lang-toggle">         <button class="lang-btn active" id="btn-te" onclick="setLanguage('te')">తెలుగు</button>         <button class="lang-btn" id="btn-en" onclick="setLanguage('en')">English</button>       </div>       <div id="kanda-container"></div>     </div>      <!-- QUIZ TAB -->     <div id="quiz" class="tab-content">       <h2 style="color: #00e5ff; margin-bottom: 15px;">Ramayan Kids Quiz</h2>       <div id="quiz-container"></div>     </div>      <!-- DAILY TASKS TAB -->     <div id="tasks" class="tab-content">       <h2 style="color: #00e5ff; margin-bottom: 10px;">Daily Good Habits & Values</h2>       <p style="color: #ccc; margin-bottom: 20px;">Complete these daily activities together with your parents to learn virtues from Lord Rama and Sita Devi.</p>       <div id="task-container"></div>     </div>   </div>    <script>     // --- BACKGROUND CANVAS CODE ---     const canvas = document.getElementById('bg-canvas');     const ctx = canvas.getContext('2d');     let width, height;     let particles = [];     let mouse = { x: null, y: null, radius: 150 };      function initCanvas() {       width = canvas.width = window.innerWidth;       height = canvas.height = window.innerHeight;       particles = [];       const particleCount = Math.floor((width * height) / 12000);       for (let i = 0; i < particleCount; i++) {         particles.push({           x: Math.random() * width,           y: Math.random() * height,           vx: (Math.random() - 0.5) * 0.6,           vy: (Math.random() - 0.5) * 0.6,           radius: Math.random() * 1.8 + 0.8,           alpha: Math.random() * 0.5 + 0.2         });       }     }      window.addEventListener('resize', initCanvas);     window.addEventListener('mousemove', (e) => {       mouse.x = e.clientX;       mouse.y = e.clientY;     });      function draw() {       ctx.clearRect(0, 0, width, height);       const gradient = ctx.createRadialGradient(         width * 0.2, height * 0.2, 0,         width * 0.2, height * 0.2, width * 0.6       );       gradient.addColorStop(0, 'rgba(0, 229, 255, 0.08)');       gradient.addColorStop(1, 'rgba(8, 9, 10, 0)');       ctx.fillStyle = gradient;       ctx.fillRect(0, 0, width, height);        particles.forEach((p, i) => {         p.x += p.vx;         p.y += p.vy;         if (p.x < 0 || p.x > width) p.vx *= -1;         if (p.y < 0 || p.y > height) p.vy *= -1;          ctx.beginPath();         ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);         ctx.fillStyle = `rgba(0, 229, 255, ${p.alpha})`;         ctx.fill();          for (let j = i + 1; j < particles.length; j++) {           const p2 = particles[j];           const dx = p.x - p2.x;           const dy = p.y - p2.y;           const dist = Math.sqrt(dx * dx + dy * dy);            if (dist < 100) {             ctx.beginPath();             ctx.moveTo(p.x, p.y);             ctx.lineTo(p2.x, p2.y);             ctx.strokeStyle = `rgba(0, 229, 255, ${0.15 * (1 - dist / 100)})`;             ctx.lineWidth = 0.6;             ctx.stroke();           }         }          if (mouse.x && mouse.y) {           const dx = p.x - mouse.x;           const dy = p.y - mouse.y;           const dist = Math.sqrt(dx * dx + dy * dy);            if (dist < mouse.radius) {             ctx.beginPath();             ctx.moveTo(p.x, p.y);             ctx.lineTo(mouse.x, mouse.y);             ctx.strokeStyle = `rgba(168, 85, 247, ${0.25 * (1 - dist / mouse.radius)})`;             ctx.lineWidth = 0.8;             ctx.stroke();           }         }       });       requestAnimationFrame(draw);     }     initCanvas();     draw();      // --- APP DATA & LOGIC ---     let currentLang = 'te';      const kandas = [       {         id: 1,         title_te: "1. బాల కాండము (Bala Kanda)",         title_en: "1. Bala Kanda (Childhood)",         story_te: "శ్రీరాముని జననం, విశ్వామిత్రునితో యాగ రక్షణ, సీతా స్వయంవరం మరియు శ్రీరామ సీతల కళ్యాణం.",         story_en: "Birth of Lord Rama, protection of Sage Vishwamitra's ritual, lifting Shiva's bow, and marriage with Sita Devi."       },       {         id: 2,         title_te: "2. అయోధ్యా కాండము (Ayodhya Kanda)",         title_en: "2. Ayodhya Kanda (Ayodhya)",         story_te: "శ్రీరాముని పట్టాభిషేక ప్రయత్నం, కైకేయి వర కోరిక, మరియు శ్రీరాముని 14 సంవత్సరాల అరణ్యవాసం.",         story_en: "Preparations for Lord Rama's coronation, Kaikeyi's boons, and Rama's 14-year exile to the forest."       },       {         id: 3,         title_te: "3. అరణ్య కాండము (Aranya Kanda)",         title_en: "3. Aranya Kanda (Forest)",         story_te: "దండకారణ్యంలో నివాసం, శూర్పణఖ ఘట్టం, స్వర్ణ మృగం మరియు రావణాసురుడు సీతమ్మను అపహరించుట.",         story_en: "Life in the forest, encounter with Surpanakha, golden deer illusion, and abduction of Sita by Ravana."       },       {         id: 4,         title_te: "4. కిష్కింధ కాండము (Kishkindha Kanda)",         title_en: "4. Kishkindha Kanda (Kishkindha)",         story_te: "హనుమంతునితో భేటీ, సుగ్రీవునితో మైత్రి, వాలి వధ మరియు సీతాన్వేషణ ప్రారంభం.",         story_en: "Meeting Lord Hanuman, friendship with Sugriva, slaying of Vali, and search for Sita."       },       {         id: 5,         title_te: "5. సుందర కాండము (Sundara Kanda)",         title_en: "5. Sundara Kanda (Beauty)",         story_te: "హనుమంతుని సముద్ర లంఘనం, లంకలో సీతాదేవి దర్శనం, ముద్రిక అందజేత మరియు లంకాదహనం.",         story_en: "Hanuman's leap across the ocean, locating Sita in Ashoka Vatika, delivering the ring, and burning Lanka."       },       {         id: 6,         title_te: "6. యుద్ధ కాండము (Yuddha Kanda)",         title_en: "6. Yuddha Kanda (War)",         story_te: "రామసేతు నిర్మాణం, శ్రీరామ రావణ యుద్ధం, రావణ వధ, సీతారాముల అయోధ్యా పునరాగమనం మరియు పట్టాభిషేకం.",         story_en: "Building Ram Setu bridge, battle against Ravana, slaying of Ravana, return to Ayodhya, and grand coronation."       }     ];      const quizzes = [       {         q: "Who gave birth to Lord Rama? (శ్రీరాముని తల్లి ఎవరు?)",         opts: ["Kausalya (కౌసల్య)", "Kaikeyi (కైకేయి)", "Sumitra (సుమిత్ర)"],         ans: 0       },       {         q: "Which sage requested Rama to protect his Yajna? (శ్రీరాముడిని యాగానికి తీసుకెళ్లిన మహర్షి ఎవరు?)",         opts: ["Vashishta (వశిష్ఠ)", "Vishwamitra (విశ్వామిత్ర)", "Agastya (అగస్త్య)"],         ans: 1       },       {         q: "Who crossed the ocean to reach Lanka? (సముద్రాన్ని దాటి లంకకు వెళ్ళినది ఎవరు?)",         opts: ["Lakshmana (లక్ష్మణుడు)", "Sugriva (సుగ్రీవుడు)", "Hanuman (హనుమంతుడు)"],         ans: 2       }     ];      const tasks = [       "Obey parents and touch their feet in the morning (తల్లిదండ్రుల ఆశీర్వాదం తీసుకోవడం).",       "Speak only truth all day like Lord Rama (శ్రీరాముడిలా నిజమే మాట్లాడటం).",       "Help a sibling or friend in their task (ఇతరులకు సహాయం చేయడం).",       "Chant 'Jai Shri Ram' 11 times before bedtime (పడుకునే ముందు జై శ్రీరామ్ అని స్మరించుకోవడం)."     ];      function switchTab(tabId) {       document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));       document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));       document.getElementById(tabId).classList.add('active');       event.target.classList.add('active');     }      function setLanguage(lang) {       currentLang = lang;       document.getElementById('btn-te').classList.toggle('active', lang === 'te');       document.getElementById('btn-en').classList.toggle('active', lang === 'en');       renderKandas();     }      function renderKandas() {       const container = document.getElementById('kanda-container');       container.innerHTML = kandas.map(k => `         <div class="kanda-card">           <h3>${currentLang === 'te' ? k.title_te : k.title_en}</h3>           <p>${currentLang === 'te' ? k.story_te : k.story_en}</p>           <div class="controls">             <button class="btn" onclick="speakText('${currentLang === 'te' ? k.story_te : k.story_en}')">🔊 Listen Audio</button>           </div>         </div>       `).join('');     }      function speakText(text) {       window.speechSynthesis.cancel();       const speech = new SpeechSynthesisUtterance(text);       speech.lang = currentLang === 'te' ? 'te-IN' : 'en-US';       window.speechSynthesis.speak(speech);     }      function renderQuiz() {       const container = document.getElementById('quiz-container');       container.innerHTML = quizzes.map((q, qIndex) => `         <div style="margin-bottom: 20px;">           <div class="quiz-q">${qIndex + 1}. ${q.q}</div>           ${q.opts.map((opt, oIndex) => `             <button class="quiz-opt" onclick="checkAnswer(${qIndex}, ${oIndex}, this)">${opt}</button>           `).join('')}         </div>       `).join('');     }      function checkAnswer(qIdx, oIdx, btn) {       if (oIdx === quizzes[qIdx].ans) {         btn.style.background = 'rgba(34, 197, 94, 0.4)';         btn.style.borderColor = '#22c55e';       } else {         btn.style.background = 'rgba(239, 68, 68, 0.4)';         btn.style.borderColor = '#ef4444';       }     }      function renderTasks() {       const container = document.getElementById('task-container');       container.innerHTML = tasks.map((t, idx) => `         <div class="task-item">           <label style="cursor:pointer; display:flex; align-items:center;">             <input type="checkbox" onchange="this.nextElementSibling.style.textDecoration = this.checked ? 'line-through' : 'none'">             <span>${t}</span>           </label>         </div>       `).join('');     }      // Init     renderKandas();     renderQuiz();     renderTasks();   </script> </body> </html>
